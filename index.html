<!DOCTYPE html>
<html lang="en-us">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta http-equiv="Pragma" content="no-cache">

    <link rel="shortcut icon" type="image/x-icon" href="ico.ico">

  </head>

  <body>
    <div id="indev-screen">
      <div class="card">
        <img src="logo.png" class="logo" alt="ULTRAKILL">
        <div class="badge">in-dev</div>
        <p>this is a webport of the game ultrakill, this is the ultrarevamp update. shaders and some features WILL be bugged; im working to fix that. please be patient as this WILL be updated regularly.</p>
        <a href="https://discord.gg/gRtkD9BMKA" target="_blank" rel="noopener noreferrer" class="btn">report bugs on discord</a>
        <br>
        <button id="start-btn" class="btn" type="button">start game</button>
      </div>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="lock-hint">click to look around</div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var hint = document.querySelector("#lock-hint");
      var buildUrl = "Build";
      var loaderUrl = "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.loader.js";
      var config = {
        dataUrl: "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.data.unityweb?v=3",
        frameworkUrl: "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.framework.js.unityweb",
        codeUrl: "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita",
        productName: "ULTRAKILL",
        productVersion: "4.1",
        matchWebGLToCanvasSize: false,
        autoSyncPersistentDataPath: true,
        devicePixelRatio: 1,
        cacheControl: function(url) {
          // The data file changes whenever the build itself is patched, so it must
          // never be treated as permanently cacheable. Bundles and the wasm pair
          // only change with a full rebuild, which republishes the manifest.
          if (/WebGL\.data\.unityweb/i.test(url)) return "no-store";
          if (/\.unityweb|\.bundle|\.wasm/i.test(url)) return "immutable";
          return "no-store";
        }
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      canvas.requestFullscreen = function() {
        return Promise.resolve();
      };
      canvas.webkitRequestFullscreen = function() {
        return Promise.resolve();
      };
      canvas.addEventListener("dblclick", function(e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);
      canvas.addEventListener("contextmenu", function(e) {
        e.preventDefault();
      }, true);

      // ------------------------------------------------------------------
      // Mouse capture. The port gives the page no menu state of its own: it
      // never asks for pointer lock (Unity WebGL's Cursor.lockState is a no-op
      // here) and it keeps the CSS cursor visible, so gameplay has to be
      // inferred. Two things mark gameplay:
      //   * a gameplay key (WASD, jump, fire, interactions), and
      //   * the game hiding its cursor, if it ever does (style.cursor = "none").
      // Anything that releases the pointer - Esc, the game showing a cursor -
      // disarms the click capture, so menu clicks stay menu clicks and the
      // cursor stays free in UI. While disarmed a movement key re-arms it,
      // which is what happens the instant play resumes.
      // ------------------------------------------------------------------
      var nativeRequestPointerLock = Element.prototype.requestPointerLock;
      var nativeExitPointerLock = Document.prototype.exitPointerLock;
      var pointerLockWanted = false;
      var playArmed = false;
      var lockNeedsGesture = false;
      var lastAttempt = 0;
      var ourCursorWrite = null;
      var gameCursorHidden = false;
      var cursorOverridden = false;
      var GAMEPLAY_KEY = /^(w|a|s|d|q|e|r|f|c|v|shift|control|space)$/i;
      var gameplayKeyHeld = false;

      function pointerIsLocked() {
        return document.pointerLockElement === canvas;
      }

      function updateHint() {
        if (!hint) return;
        hint.style.display = (!pointerIsLocked() && lockNeedsGesture) ? "block" : "none";
      }

      function writeCursor(value) {
        ourCursorWrite = value;
        canvas.style.cursor = value;
      }

      // While captured the browser hides the cursor for us. Whenever we are not
      // captured the cursor must be on screen, whatever the game asked for, so
      // menus and UI always have a pointer you can see and use.
      function showCursor() {
        if (pointerIsLocked()) return;
        if (canvas.style.cursor !== "none") return;
        cursorOverridden = true;
        writeCursor("default");
      }

      // Put the game's own cursor state back once it no longer matters, so its
      // next cursor change still reads as a real change to us.
      function restoreGameCursor() {
        if (!cursorOverridden) return;
        cursorOverridden = false;
        writeCursor(gameCursorHidden ? "none" : "default");
      }

      function releasePointer() {
        if (pointerIsLocked()) nativeExitPointerLock.call(document);
        showCursor();
      }

      function attemptPointerLock() {
        if (pointerIsLocked()) return Promise.resolve();
        lastAttempt = Date.now();
        var request;
        try {
          request = nativeRequestPointerLock.call(canvas);
        } catch (err) {
          if (pointerLockWanted) {
            lockNeedsGesture = true;
            updateHint();
          }
          return Promise.reject(err);
        }
        var pending = (request && typeof request.then === "function") ? request : null;
        if (!pending) {
          pending = new Promise(function(resolve, reject) {
            var settled = false;
            function check() {
              if (settled) return;
              settled = true;
              if (pointerIsLocked()) resolve();
              else reject(new Error("pointer lock was refused"));
            }
            document.addEventListener("pointerlockchange", check);
            document.addEventListener("pointerlockerror", check);
            setTimeout(check, 500);
          });
        }
        return pending.then(function() {
          playArmed = true;
          lockNeedsGesture = false;
          restoreGameCursor();
          updateHint();
        }, function(err) {
          // Browsers only grant this from an input event. The next click or
          // key press retries, so the capture is never silently lost.
          if (pointerLockWanted && !pointerIsLocked()) {
            lockNeedsGesture = true;
            updateHint();
            showCursor();
          }
          throw err;
        });
      }

      function armAndCapture() {
        playArmed = true;
        pointerLockWanted = true;
        return attemptPointerLock().catch(function() {});
      }

      Element.prototype.requestPointerLock = function(options) {
        if (this !== canvas) return nativeRequestPointerLock.apply(this, arguments);
        return armAndCapture().catch(function() {});
      };

      Document.prototype.exitPointerLock = function() {
        pointerLockWanted = false;
        playArmed = false;
        lockNeedsGesture = false;
        var result = nativeExitPointerLock.apply(this, arguments);
        showCursor();
        updateHint();
        return result;
      };

      // The game's own cursor state, if it ever writes one: hidden cursor means
      // it wants mouse look, a visible one means it wants the pointer back.
      function syncWithGameCursor() {
        var current = canvas.style.cursor;
        if (ourCursorWrite !== null) {
          var wasOurs = current === ourCursorWrite;
          ourCursorWrite = null;
          if (wasOurs) return;
        }
        gameCursorHidden = current === "none";
        if (gameCursorHidden) {
          armAndCapture();
          if (!pointerIsLocked()) showCursor();
        } else {
          pointerLockWanted = false;
          playArmed = false;
          gameplayKeyHeld = false;
          lockNeedsGesture = false;
          releasePointer();
        }
        updateHint();
      }
      if (window.MutationObserver) {
        new MutationObserver(syncWithGameCursor)
          .observe(canvas, { attributes: true, attributeFilter: ["style"] });
      }

      // A gameplay key means the player is playing: re-arm and capture. This is
      // also what gets the pointer back after Esc without stealing menu clicks.
      document.addEventListener("keydown", function(event) {
        if (event.metaKey || event.altKey) return;
        if (!GAMEPLAY_KEY.test(event.key || "")) return;
        gameplayKeyHeld = true;
        if (event.repeat || pointerIsLocked()) return;
        armAndCapture();
      }, true);
      document.addEventListener("keyup", function(event) {
        if (GAMEPLAY_KEY.test(event.key || "")) gameplayKeyHeld = false;
      }, true);
      window.addEventListener("blur", function() {
        gameplayKeyHeld = false;
      });

      // Clicks only capture once play is armed, so menu buttons stay clickable.
      // Firing while moving counts as play, which covers starting a run without
      // touching a movement key first.
      canvas.addEventListener("pointerdown", function(event) {
        canvas.focus();
        if (pointerIsLocked()) return;
        if (!playArmed && !gameplayKeyHeld) return;
        attemptPointerLock().catch(function() {});
      });

      document.addEventListener("pointerlockchange", function() {
        if (pointerIsLocked()) {
          playArmed = true;
          lockNeedsGesture = false;
        } else {
          // Esc, or the game releasing the pointer: back to free-cursor mode.
          playArmed = false;
          gameplayKeyHeld = false;
          showCursor();
        }
        updateHint();
      }, false);

      document.addEventListener("pointerlockerror", function() {
        if (pointerLockWanted && !pointerIsLocked()) {
          lockNeedsGesture = true;
          showCursor();
          updateHint();
        }
      }, false);

      var booted = false;
      var started = false;
      function startGame() {
        started = true;
        document.getElementById("indev-screen").style.display = "none";
        container.style.visibility = "visible";
        loadUnityGame();
      }
      document.getElementById("start-btn").addEventListener("click", startGame);
      window.addEventListener("beforeunload", function(e) {
        if (!started) return;
        e.preventDefault();
        e.returnValue = "";
        return "";
      });
      
async function prepareAssetWorker() {
  if (!("serviceWorker" in navigator)) throw new Error("This browser does not support service workers.");
  await navigator.serviceWorker.register("service-worker.js");
  await navigator.serviceWorker.ready;
  // The worker can take control either just before or just after this point, so
  // poll for the controller as well as listening for controllerchange. Waiting on
  // the event alone could miss it and stall the load at 0%.
  var deadline = Date.now() + 20000;
  while (!navigator.serviceWorker.controller) {
    if (Date.now() > deadline) {
      throw new Error("The asset worker did not take control. Please reload and try again.");
    }
    await new Promise(function(resolve) {
      var settled = false;
      function finish() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        navigator.serviceWorker.removeEventListener("controllerchange", finish);
        resolve();
      }
      var timer = setTimeout(finish, 200);
      navigator.serviceWorker.addEventListener("controllerchange", finish);
    });
  }
}

      async function loadUnityGame() {
        if (booted) return;
        booted = true;
        loadingBar.style.display = "block";
        try {
          await prepareAssetWorker();
        } catch (err) {
          var errorText = loadingBar.querySelector("p");
          if (!errorText) {
            errorText = document.createElement("p");
            loadingBar.appendChild(errorText);
          }
          errorText.textContent = "Asset setup failed: " + err.message;
          booted = false;
          return;
        }
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function(unityInstance) {
            loadingBar.style.display = "none";
            updateHint();
            unityInstance.SetFullscreen = function() {
              return 0;
            };
          }).catch(function(message) {
            var m = loadingBar.querySelector("p");
            if (!m) {
              m = document.createElement("p");
              loadingBar.appendChild(m);
            }
            m.textContent = message;
          });
        };
        script.onerror = function() {
          var m = loadingBar.querySelector("p");
          if (!m) {
            m = document.createElement("p");
            loadingBar.appendChild(m);
          }
          m.textContent = "Could not load Unity loader script. Check the asset proxy.";
          booted = false;
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
