<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ULTRAKILL</title>
    <link rel="icon" type="image/x-icon" href="ico.ico">
    <link rel="shortcut icon" type="image/x-icon" href="ico.ico">
    <link rel="stylesheet" href="style.css">
  </head>
    <script async src="https://googletagmanager.com"></script>
      <script>

          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());

  <body>
    <div id="indev-screen">
      <div class="card">
        <img src="logo.png" class="logo" alt="ULTRAKILL">
        <div class="badge">in-dev</div>
        <p>this is a webport of the game ultrakill, this is the ultrarevamp update. shaders and some features WILL be bugged; im working to fix that. please be patient as this WILL be updated regularly.</p>
        <a href="https://discord.gg/gRtkD9BMKA" target="_blank" rel="noopener noreferrer" class="btn">report bugs on discord</a>
        <br>
        <button id="start-btn" class="btn" type="button">start game</button>
      </div>
    </div>
      <style>
      /* Keeps the pointer usable whenever it is not captured, without writing to
         the canvas style (the game owns that, and we read it for gameplay state). */
      #unity-container.cursor-forced #unity-canvas { cursor: default !important; }
    </style>
  <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="lock-hint">click to look around</div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      // The canvas shipped with a fixed 960x600 drawing buffer while CSS stretches
      // it to the whole window, so everything Unity draws (splash logo included)
      // was scaled to 16:10 and looked stretched on any other aspect. Keep the
      // buffer equal to the displayed size instead, before the engine starts.
      function fitCanvasToDisplay() {
        var width = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth));
        var height = Math.max(1, Math.round(canvas.clientHeight || window.innerHeight));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }
      fitCanvasToDisplay();
      window.addEventListener("resize", fitCanvasToDisplay);
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var hint = document.querySelector("#lock-hint");
      var buildUrl = "Build";
      var loaderUrl = "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.loader.js";
      var config = {
        dataUrl: "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.data.unityweb?v=3",
        frameworkUrl: "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.framework.js.unityweb",
        codeUrl: "https://everyonesim.github.io/ultraport/asset-proxy/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita",
        productName: "ULTRAKILL",
        productVersion: "4.1",
        matchWebGLToCanvasSize: true,
        autoSyncPersistentDataPath: true,
        devicePixelRatio: 1,
        cacheControl: function(url) {
          // The data file changes whenever the build itself is patched, so it must
          // never be treated as permanently cacheable. Bundles and the wasm pair
          // only change with a full rebuild, which republishes the manifest.
          if (/WebGL\.data\.unityweb/i.test(url)) return "no-store";
          if (/\.unityweb|\.bundle|\.wasm/i.test(url)) return "immutable";
          return "no-store";
        }
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      canvas.requestFullscreen = function() {
        return Promise.resolve();
      };
      canvas.webkitRequestFullscreen = function() {
        return Promise.resolve();
      };
      canvas.addEventListener("dblclick", function(e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);
      canvas.addEventListener("contextmenu", function(e) {
        e.preventDefault();
      }, true);

      // ------------------------------------------------------------------
      // Mouse capture. The port never asks for the lock and never signals whether
      // it is in a menu, so this shell owns the capture and drives it from input.
      // Turning is unlimited only while the pointer is captured, so capture is
      // attempted from every input the page can see, kept while playing, and
      // released by Esc, a double click, or the release key when a menu needs the
      // cursor back.
      // ------------------------------------------------------------------
      var nativeRequestPointerLock = Element.prototype.requestPointerLock ||
        Element.prototype.mozRequestPointerLock ||
        Element.prototype.webkitRequestPointerLock ||
        Element.prototype.msRequestPointerLock;
      var nativeExitPointerLock = Document.prototype.exitPointerLock ||
        Document.prototype.mozExitPointerLock ||
        Document.prototype.webkitExitPointerLock ||
        Document.prototype.msExitPointerLock;
      var captureWanted = true;
      var needsGesture = false;
      var lastAttempt = 0;
      var lastActivity = Date.now();
      var idleWatch = null;
      var IDLE_RELEASE_MS = 6000;
      var RETRY_MS = 300;
      var graceUntil = 0;
      var userEscaped = false;
      var escapeTimer = null;

      function lockedElement() {
        return document.pointerLockElement ||
          document.mozPointerLockElement ||
          document.webkitPointerLockElement ||
          document.msPointerLockElement ||
          null;
      }

      function pointerIsLocked() {
        return lockedElement() === canvas;
      }

      function noteActivity() {
        lastActivity = Date.now();
      }

      function updateHint() {
        if (!hint) return;
        hint.style.display = (needsGesture && !pointerIsLocked()) ? "block" : "none";
      }

      function updateCursor() {
        if (!container) return;
        container.classList.toggle("cursor-forced", !pointerIsLocked());
      }

      function startIdleWatch() {}

      // Ask for the capture. Browsers only grant it from inside an input event, so
      // a refusal is normal and is retried by the next input and by the watchdog.
      function requestCapture(via) {
        if (pointerIsLocked()) return Promise.resolve();
        captureWanted = true;
        lastAttempt = Date.now();
        if (canvas.focus) {
          try { canvas.focus({ preventScroll: true }); } catch (err) { canvas.focus(); }
        }
        var result;
        try {
          result = nativeRequestPointerLock.call(canvas);
        } catch (err) {
          needsGesture = true;
          updateHint();
          return Promise.reject(err);
        }
        var pending = (result && typeof result.then === "function") ? result : null;
        if (!pending) {
          pending = new Promise(function(resolve, reject) {
            var settled = false;
            function settle() {
              if (settled) return;
              settled = true;
              if (pointerIsLocked()) resolve();
              else reject(new Error("pointer lock refused"));
            }
            document.addEventListener("pointerlockchange", settle);
            document.addEventListener("pointerlockerror", settle);
            setTimeout(settle, 400);
          });
        }
        return pending.then(function() {
          needsGesture = false;
          noteActivity();
          startIdleWatch();
          updateCursor();
          updateHint();
        }, function(err) {
          if (!pointerIsLocked()) {
            needsGesture = true;
            updateCursor();
            updateHint();
          }
          throw err;
        });
      }

      function tryCapture() {
        if (pointerIsLocked()) return;
        if (Date.now() - lastAttempt < 120) return;
        requestCapture("input").catch(function() {});
      }

      function releasePointer() {
        captureWanted = false;
        needsGesture = false;
        lastAttempt = 0;
        graceUntil = Date.now() + 1500;
        if (nativeExitPointerLock && pointerIsLocked()) {
          try { nativeExitPointerLock.call(document); } catch (err) {}
        }
        updateCursor();
        updateHint();
      }

      // The game's own lock calls, if it ever makes them, keep working.
      Element.prototype.requestPointerLock = function(options) {
        if (this === canvas) {
          captureWanted = true;
          return requestCapture("game").catch(function() {});
        }
        return nativeRequestPointerLock.apply(this, arguments);
      };
      Document.prototype.exitPointerLock = function() {
        // Nothing in this port ever asks for the lock to end, and a frame-by-frame
        // exit call from the game is exactly what kept dropping the capture, so
        // the game cannot release it. Esc still exits natively.
        if (captureWanted) return undefined;
        var out = nativeExitPointerLock.apply(this, arguments);
        return out;
      };

      // Retry watch: while a capture is wanted and not held, keep asking on a
      // timer, because any input in the meantime may have granted the gesture.
      setInterval(function() {
        if (!captureWanted || pointerIsLocked()) return;
        if (Date.now() - lastAttempt < RETRY_MS) return;
        requestCapture("watchdog").catch(function() {});
      }, 400);

      // Every input the page can observe tries to capture.
      function onInput(event) {
        noteActivity();
        if (event && event.metaKey) return;
        if (event && event.key === "F8") return;   // toggle handles itself
        // Aiming motion should not grab the pointer back the moment Esc handed it
        // over; a click or a key still captures straight away.
        if (event && (event.type === "mousemove" || event.type === "wheel")) {
          if (Date.now() < graceUntil) return;
        }
        tryCapture();
      }

      canvas.addEventListener("pointerdown", onInput, true);
      canvas.addEventListener("mousedown", onInput, true);
      canvas.addEventListener("click", onInput, true);
      canvas.addEventListener("mousemove", onInput, true);
      canvas.addEventListener("wheel", onInput, { capture: true, passive: true });
      canvas.addEventListener("touchstart", onInput, true);
      canvas.addEventListener("contextmenu", function(event) {
        event.preventDefault();
        onInput(event);
      }, true);
      document.addEventListener("keydown", function(event) {
        if (event.key === "Escape" || event.key === "Esc") {
          // Only an Esc the player actually pressed may end the capture; any other
          // unlock is the page or the browser dropping it and gets re-grabbed.
          userEscaped = true;
          if (escapeTimer !== null) clearTimeout(escapeTimer);
          escapeTimer = setTimeout(function() { userEscaped = false; }, 800);
        }
        if (event.metaKey || event.altKey || event.ctrlKey) return;
        onInput(event);
      }, true);

      // F8 toggles the capture as a manual escape hatch.
      document.addEventListener("keydown", function(event) {
        if (event.key !== "F8") return;
        event.preventDefault();
        if (pointerIsLocked()) releasePointer();
        else { captureWanted = true; requestCapture("toggle").catch(function() {}); }
      }, true);

      // Esc frees it natively; keep our state in step with whatever the browser did.
      document.addEventListener("pointerlockchange", function() {
        noteActivity();
        if (pointerIsLocked()) {
          needsGesture = false;
          startIdleWatch();
          updateCursor();
          updateHint();
          return;
        }
        if (userEscaped) {
          // The player wants the cursor: stay released until they give input.
          captureWanted = false;
          lastAttempt = 0;
          graceUntil = Date.now() + 1500;
          updateCursor();
          updateHint();
          return;
        }
        // Anything else dropped the capture without the player asking (the game
        // shutting it off, the browser reclaiming it): take it straight back.
        captureWanted = true;
        lastAttempt = 0;
        setTimeout(function() {
          if (!pointerIsLocked() && captureWanted) requestCapture("relock").catch(function() {});
        }, 30);
        updateCursor();
        updateHint();
      }, false);

      document.addEventListener("pointerlockerror", function() {
        needsGesture = !pointerIsLocked();
        updateCursor();
        updateHint();
      }, false);

      // A capture that survives a tab switch is stale; drop it and re-arm.
      window.addEventListener("blur", function(event) {
        // Only the window losing focus matters: focusing the canvas blurs the
        // element that had focus and must not drop the capture.
        if (event.target !== window) return;
        releasePointer();
      });
      document.addEventListener("visibilitychange", function() {
        if (document.hidden) releasePointer();
      });
      window.addEventListener("focus", function() {
        noteActivity();
      });

      updateCursor();
      updateHint();
      var booted = false;
      var started = false;
      function startGame() {
        started = true;
        document.getElementById("indev-screen").style.display = "none";
        container.style.visibility = "visible";
        loadUnityGame();
      }
      document.getElementById("start-btn").addEventListener("click", startGame);
      window.addEventListener("beforeunload", function(e) {
        if (!started) return;
        e.preventDefault();
        e.returnValue = "";
        return "";
      });
      
async function prepareAssetWorker() {
  if (!("serviceWorker" in navigator)) throw new Error("This browser does not support service workers.");
  await navigator.serviceWorker.register("service-worker.js");
  await navigator.serviceWorker.ready;
  // The worker can take control either just before or just after this point, so
  // poll for the controller as well as listening for controllerchange. Waiting on
  // the event alone could miss it and stall the load at 0%.
  var deadline = Date.now() + 20000;
  while (!navigator.serviceWorker.controller) {
    if (Date.now() > deadline) {
      throw new Error("The asset worker did not take control. Please reload and try again.");
    }
    await new Promise(function(resolve) {
      var settled = false;
      function finish() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        navigator.serviceWorker.removeEventListener("controllerchange", finish);
        resolve();
      }
      var timer = setTimeout(finish, 200);
      navigator.serviceWorker.addEventListener("controllerchange", finish);
    });
  }
}

      async function loadUnityGame() {
        if (booted) return;
        booted = true;
        loadingBar.style.display = "block";
        try {
          await prepareAssetWorker();
        } catch (err) {
          var errorText = loadingBar.querySelector("p");
          if (!errorText) {
            errorText = document.createElement("p");
            loadingBar.appendChild(errorText);
          }
          errorText.textContent = "Asset setup failed: " + err.message;
          booted = false;
          return;
        }
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function(unityInstance) {
            loadingBar.style.display = "none";
            updateHint();
            unityInstance.SetFullscreen = function() {
              return 0;
            };
          }).catch(function(message) {
            var m = loadingBar.querySelector("p");
            if (!m) {
              m = document.createElement("p");
              loadingBar.appendChild(m);
            }
            m.textContent = message;
          });
        };
        script.onerror = function() {
          var m = loadingBar.querySelector("p");
          if (!m) {
            m = document.createElement("p");
            loadingBar.appendChild(m);
          }
          m.textContent = "Could not load Unity loader script. Check the asset proxy.";
          booted = false;
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
