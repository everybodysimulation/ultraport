      // it is in a menu, so this shell owns the capture and drives it from input.

      }

      function updateCursor() {
        if (!container) return;
        container.classList.toggle("cursor-forced", !pointerIsLocked());

      // Ask for the capture. Browsers only grant it from inside an input event, so
      // a refusal is normal and is retried by the next input and by the watchdog.
      function requestCapture(via) {

        }

            document.addEventListener("pointerlockerror", settle);
            setTimeout(settle, 400);

          noteActivity();
          startIdleWatch();
          updateCursor();
          updateHint();

            updateCursor();
            updateHint();
          }

        if (Date.now() - lastAttempt < 120) return;
        requestCapture("input").catch(function() {});

      function releasePointer() {

        updateHint();

          return requestCapture("game").catch(function() {});

      };
      Document.prototype.exitPointerLock = function() {

        // exit call from the game is exactly what kept dropping the capture, so
        // the game cannot release it. Esc still exits natively.
        if (captureWanted) return undefined;
        var out = nativeExitPointerLock.apply(this, arguments);
        return out;
      };

      // Retry watch: while a capture is wanted and not held, keep asking on a
      // timer, because any input in the meantime may have granted the gesture.
      setInterval(function() {
        if (!captureWanted || !playMode || pointerIsLocked()) return;
        if (Date.now() - lastAttempt < RETRY_MS) return;
        requestCapture("watchdog").catch(function() {});
      }, 400);

      // Every input the page can observe tries to capture.
      function onInput(event) {
        noteActivity();
        if (event && event.metaKey) return;
        if (event && event.key === "F8") return;   // toggle handles itself
        // Aiming motion should not grab the pointer back the moment Esc handed it
        // over; a click or a key still captures straight away.
        if (event && (event.type === "mousemove" || event.type === "wheel")) {
          if (Date.now() < graceUntil) return;
        }
        tryCapture();
      }

      canvas.addEventListener("pointerdown", onInput, true);
      canvas.addEventListener("mousedown", onInput, true);
      canvas.addEventListener("click", onInput, true);
      canvas.addEventListener("mousemove", onInput, true);
      canvas.addEventListener("wheel", onInput, { capture: true, passive: true });
      canvas.addEventListener("touchstart", onInput, true);
      canvas.addEventListener("contextmenu", function(event) {
        event.preventDefault();
        onInput(event);
      }, true);
      document.addEventListener("keydown", function(event) {

          // unlock is the page or the browser dropping it and gets re-grabbed.
          userEscaped = true;
          if (escapeTimer !== null) clearTimeout(escapeTimer);
          escapeTimer = setTimeout(function() { userEscaped = false; }, 800);
        }
        if (MOVE_KEY.test(event.key || "") && event.key !== "Control") {
          playMode = true;
        } else if (event.key === "Control" && !event.ctrlKey) {
          playMode = true;

        onInput(event);

        else { captureWanted = true; requestCapture("toggle").catch(function() {}); }
      }, true);

          updateHint();

          playMode = false;
          lastAttempt = 0;
          graceUntil = Date.now() + 1500;
          updateCursor();
          updateHint();
          return;

        // shutting it off, the browser reclaiming it): take it straight back.

        lastAttempt = 0;

        updateHint();

        updateHint();

      updateHint();

        e.preventDefault();
        e.returnValue = "";

async function prepareAssetWorker() {
  if (!("serviceWorker" in navigator)) throw new Error("This browser does not support service workers.");
  await navigator.serviceWorker.register("service-worker.js");
  await navigator.serviceWorker.ready;
  // The worker can take control either just before or just after this point, so
  // poll for the controller as well as listening for controllerchange. Waiting on
  // the event alone could miss it and stall the load at 0%.
  var deadline = Date.now() + 20000;
  while (!navigator.serviceWorker.controller) {
    if (Date.now() > deadline) {
      throw new Error("The asset worker did not take control. Please reload and try again.");
    }
    await new Promise(function(resolve) {
      var settled = false;
      function finish() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        navigator.serviceWorker.removeEventListener("controllerchange", finish);
        resolve();
      }
      var timer = setTimeout(finish, 200);
      navigator.serviceWorker.addEventListener("controllerchange", finish);
    });
  }

      // ------------------------------------------------------------------
      // Starter save. ULTRAKILL keeps progress in BinaryFormatter files under
      // <persistentDataPath>/Saves/Slot1. The port ships a prepared set: every
      // level beaten with a D rank (slow, easy to improve on), every weapon and
      // variant unlocked, no Cyber Grind or sandbox records. It is written into
      // the engine filesystem once per browser, then the page reloads so the
      // game boots with it loaded.
      // ------------------------------------------------------------------
      var SAVE_KEY = "ultraport-starter-save-v9";

      function base64ToBytes(value) {
        var binary = atob(value);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function ensureDir(FS, path) {
        var parts = path.split("/").filter(Boolean);
        var current = "";
        for (var i = 0; i < parts.length; i++) {
          current += "/" + parts[i];
          try { FS.mkdir(current); } catch (err) {}
        }
      }

      // Writing through the engine's own filesystem needs the Module, which some
      // loaders do not expose, so the save is also written straight into the
      // engine's IndexedDB store before boot. That store keeps one folder per
      // site, whose name is read back from the existing keys.
      var starterSavePromise = null;

      function loadStarterSave() {
        if (!starterSavePromise) {
          starterSavePromise = fetch("save/slot1.json", { cache: "no-store" })
            .then(function (response) { return response.ok ? response.json() : null; })
            .catch(function () { return null; });
        }
        return starterSavePromise;
      }

      function seedIndexedDbAtRoot(data, root) {
        return openEngineStore().then(function (db) {
          return new Promise(function (resolve) {
            var transaction;
            try { transaction = db.transaction("FILE_DATA", "readwrite"); } catch (err) { resolve(false); return; }
            var store = transaction.objectStore("FILE_DATA");
            try {
              store.put({ timestamp: new Date(), mode: 16877, contents: null }, root + "/Saves");
              store.put({ timestamp: new Date(), mode: 16877, contents: null }, root + "/Saves/Slot1");
              Object.keys(data.files).forEach(function (name) {
                store.put({ timestamp: new Date(), mode: 33206, contents: base64ToBytes(data.files[name]) }, root + "/Saves/Slot1/" + name);
              });
            } catch (err) { resolve(false); return; }
            transaction.oncomplete = function () { resolve(true); };
            transaction.onerror = function () { resolve(false); };
            transaction.onabort = function () { resolve(false); };
          });
        }).catch(function () { return false; });
      }

      function seedIndexedDbSave(data) {
        return new Promise(function (resolve) {
          if (!data || !data.files || !window.indexedDB) { resolve(false); return; }
          var request;
          try { request = indexedDB.open("/idbfs", 21); } catch (err) { resolve(false); return; }
          request.onupgradeneeded = function (event) {
            var db = event.target.result;
            var store = db.objectStoreNames.contains("FILE_DATA")
              ? event.target.transaction.objectStore("FILE_DATA")
              : db.createObjectStore("FILE_DATA");
            if (!store.indexNames.contains("timestamp")) {
              store.createIndex("timestamp", "timestamp", { unique: false });
            }
          };
          request.onerror = function () { resolve(false); };
          request.onsuccess = function () {
            var db = request.result;
            var transaction;
            try { transaction = db.transaction("FILE_DATA", "readwrite"); } catch (err) { resolve(false); return; }
            var store = transaction.objectStore("FILE_DATA");
            var keysRequest = store.getAllKeys();
            keysRequest.onerror = function () { resolve(false); };
            keysRequest.onsuccess = function () {
              // Keys are absolute engine paths (/idbfs/<folder>/...), so the
              // save root is the part before Saves, not the first segment.
              var keys = keysRequest.result || [];
              var root = null;
              var i;
              for (i = 0; i < keys.length && !root; i++) {
                var key = String(keys[i]);
                var cut = key.indexOf("/Saves");
                if (cut > 0) root = key.slice(0, cut);
              }
              for (i = 0; i < keys.length && !root; i++) {
                var parts = String(keys[i]).split("/").filter(Boolean);
                if (parts.length >= 2 && parts[0] === "idbfs") root = "/idbfs/" + parts[1];
              }
              if (!root) { resolve(false); return; }
              var base = root + "/Saves/Slot1";
              var now = new Date();
              try {
                store.put({ timestamp: now, mode: 16877, contents: null }, root + "/Saves");
                store.put({ timestamp: now, mode: 16877, contents: null }, base);
                Object.keys(data.files).forEach(function (name) {
                  store.put({
                    timestamp: new Date(),
                    mode: 33206,
                    contents: base64ToBytes(data.files[name])
                  }, base + "/" + name);
                });
              } catch (err) { resolve(false); return; }
              transaction.oncomplete = function () { resolve(true); };
              transaction.onerror = function () { resolve(false); };
              transaction.onabort = function () { resolve(false); };
            };
          };
        });
      }

      // Runs before the engine boots so the slot is already populated when the
      // game reads it, with no reload needed.
      async function seedStarterSaveBeforeBoot() {
        try {
          if (localStorage.getItem(SAVE_KEY) === "done") return;
          var data = await loadStarterSave();
          var knownRoot = null;
          try { knownRoot = localStorage.getItem("ultraport-save-root"); } catch (err) {}
          var seeded = knownRoot
            ? await seedIndexedDbAtRoot(data, knownRoot)
            : await seedIndexedDbSave(data);
          if (seeded) localStorage.setItem(SAVE_KEY, "done");
        } catch (err) {}
      }

      // The engine's own save is patched in place rather than replaced: its files
      // are already the exact format and slot this build reads, and this works
      // without knowing the engine's hashed folder name.
      // Patch ULTRAKILL's BinaryFormatter saves in place: set every level rank to D,
      // clear challenge/secrets/assists, unlock every weapon variant.
      function patchBepis(bytes, kind) {
        var d = bytes;
        if (d[0] !== 0) return null;
        var p = 17;
        function i32(at) { return (d[at] | (d[at+1]<<8) | (d[at+2]<<16) | (d[at+3]<<24)); }
        function lps() { var n = d[p]; p++; var s = ""; for (var i=0;i<n;i++) s += String.fromCharCode(d[p+i]); p += n; return s; }
        while (p < d.length) {
          var rt = d[p];
          if (rt === 0x0c) { p++; p += 4; lps(); continue; }
          if (rt !== 0x05) return null;
          p++; p += 4;
          lps();                                  // class name
          var count = i32(p); p += 4;
          var names = [];
          for (var i=0;i<count;i++) names.push(lps());
          var rawTypes = [];
          for (var i=0;i<count;i++) { rawTypes.push(d[p]); p++; }
          var types = [];
          for (var i=0;i<count;i++) {
            var t = rawTypes[i];
            if (t === 7) { types.push({kind:"parr", et:d[p]}); p++; }
            else if (t === 0) { types.push({kind:"prim", pt:d[p]}); p++; }
            else if (t === 3 || t === 4) { lps(); p += 4; types.push({kind:"class"}); }
            else types.push({kind:"obj"});
          }
          p += 4;                                  // library id
          var members = [], arrays = {};
          for (var i=0;i<count;i++) {
            var ty = types[i], m = {name:names[i], kind:ty.kind, type:(ty.et || ty.pt)};
            if (ty.kind === "prim") { m.voff = p; m.size = (ty.pt === 1 ? 1 : 4); p += m.size; }
            else if (ty.kind === "parr") {
              if (d[p] === 0x09) { m.refid = i32(p+1); p += 5; }

      function saveFolderCandidates() {
        var path = location.pathname;
        var href = location.href;
        var host = location.hostname;
        var seeds = [
          path, href, location.origin + path, host, host + path,
          "Hakita" + "ULTRAKILL", "ULTRAKILL", path + "/", href.split("?")[0]
        ];
        var out = [];
        for (var i = 0; i < seeds.length; i++) {
          var value = md5Hex(seeds[i]);
          if (out.indexOf(value) === -1) out.push(value);
        }
        return out;
      }

      function forceEnginePersist(instance) {
        var Module = instance && instance.Module;
        if (!Module || !Module.FS_createDataFile) return false;
        try {
          Module.FS_createDataFile("/idbfs", "ultraport-probe", new Uint8Array([1]), true, true, true);
          return true;
        } catch (err) {
          return false;
        }
      }

      function installStarterSaveFiles(data) {
        return openEngineStore().then(function (db) {
          return new Promise(function (resolve) {
            var transaction;
            try { transaction = db.transaction("FILE_DATA", "readwrite"); } catch (err) { resolve("none"); return; }
            var store = transaction.objectStore("FILE_DATA");
            var keysRequest = store.getAllKeys();
            var settled = false;
            function finish(result) { if (!settled) { settled = true; resolve(result); } }
            transaction.oncomplete = function () { finish("none"); };
            transaction.onerror = function () { finish("none"); };
            transaction.onabort = function () { finish("none"); };
            keysRequest.onsuccess = function () {
              var keys = keysRequest.result || [];
              var root = null;
              var slotDir = null;
              for (var i = 0; i < keys.length; i++) {
                var key = String(keys[i]);
                var cut = key.indexOf("/Saves");
                if (cut > 0 && !root) root = key.slice(0, cut);
                if (!slotDir) {
                  var match = key.match(/^(.*\/Saves\/[^\/]+)\//);
                  if (match) slotDir = match[1];
                }
                if (!root && key.indexOf("ultraport-probe") === -1) {
                  var bits = key.split("/").filter(Boolean);
                  if (bits.length >= 2 && bits[0] === "idbfs" && bits[1] !== "Saves" && bits[1].indexOf("ultraport-probe") !== 0) {
                    root = "/idbfs/" + bits[1];
                  }
                }
              }
              if (!root) {
                // Nothing from the engine yet: write the likely folder names instead.
                try {
                  var guessed = saveFolderCandidates();
                  guessed.forEach(function (folder) {
                    var dir = "/idbfs/" + folder + "/Saves/Slot1";
                    store.put({ timestamp: new Date(), mode: 16877, contents: null }, "/idbfs/" + folder + "/Saves");
                    store.put({ timestamp: new Date(), mode: 16877, contents: null }, dir);
                    Object.keys(data.files).forEach(function (name) {
                      store.put({ timestamp: new Date(), mode: 33206, contents: base64ToBytes(data.files[name]) }, dir + "/" + name);
                    });
                  });
                  finish("guessed");
                } catch (err) { finish("none"); }
                return;
              }
              if (!slotDir) slotDir = root + "/Saves/Slot1";
              try { localStorage.setItem("ultraport-save-root", root); } catch (err) {}
              try {
                var targets = [slotDir];
                saveFolderCandidates().forEach(function (folder) {
                  var guess = "/idbfs/" + folder + "/Saves/Slot1";
                  if (targets.indexOf(guess) === -1) targets.push(guess);
                });
                targets.forEach(function (dir) {
                  var folderRoot = dir.slice(0, dir.indexOf("/Saves"));
                  store.put({ timestamp: new Date(), mode: 16877, contents: null }, folderRoot + "/Saves");
                  store.put({ timestamp: new Date(), mode: 16877, contents: null }, dir);
                  Object.keys(data.files).forEach(function (name) {
                    store.put({ timestamp: new Date(), mode: 33206, contents: base64ToBytes(data.files[name]) }, dir + "/" + name);

                });

      function installStarterSaveAfterBoot(instance) {
        if (localStorage.getItem(SAVE_KEY) === "done") return;
        var probed = false;
        loadStarterSave().then(function (data) {
          if (!data || !data.files) return;
          var attempts = 0;
          function attempt() {
            if (!probed) probed = forceEnginePersist(instance);
            installStarterSaveFiles(data).then(function (result) {
              if (result === "none") {
                attempts++;
                probed = false;
                if (attempts < 300) setTimeout(attempt, 2000);
                return;
              }
              if (result === "seeded") localStorage.setItem(SAVE_KEY, "done");
              location.reload();
            });
          }
          setTimeout(attempt, 800);
        });
      }

      function installStarterSave(instance) {
        try {
          if (localStorage.getItem(SAVE_KEY) === "done") return;
          var Module = (instance && (instance.Module || instance.unityModule)) || window.Module;
          var FS = Module && (Module.FS || window.FS);
          if (!FS || !FS.readdir || !FS.writeFile) return;
          // The engine mounts its persistent store at /idbfs and uses one
          // hashed folder inside it. Prefer whichever folder already holds a
          // Saves directory, so the path is the one the game itself uses.
          var root = null;
          var entries = [];
          try {
            entries = FS.readdir("/idbfs").filter(function (name) {
              return name !== "." && name !== "..";
            });
          } catch (err) {}
          for (var i = 0; i < entries.length && !root; i++) {
            try {
              FS.stat("/idbfs/" + entries[i] + "/Saves");
              root = "/idbfs/" + entries[i];
            } catch (err) {}
          }
          if (!root && entries.length) root = "/idbfs/" + entries[0];
          if (!root) root = Module.persistentDataPath;
          if (!root) return;
          var slotDir = root + "/Saves/Slot1";
          fetch("save/slot1.json", { cache: "no-store" })
            .then(function (response) { return response.ok ? response.json() : null; })
            .then(function (data) {
              if (!data || !data.files) return;
              ensureDir(FS, slotDir);
              var written = 0;
              Object.keys(data.files).forEach(function (name) {
                var path = slotDir + "/" + name;
                try {
                  // The engine creates its own empty save as soon as it boots,
                  // so these files already exist and have to be replaced.
                  FS.writeFile(path, base64ToBytes(data.files[name]));
                  written++;
                } catch (err) {
                  try {
                    FS.unlink(path);
                    FS.writeFile(path, base64ToBytes(data.files[name]));
                    written++;
                  } catch (err2) {}
                }
              });
              if (!written) {
                localStorage.setItem(SAVE_KEY, "done");
                return;
              }
              var finish = function () {
                localStorage.setItem(SAVE_KEY, "done");
                location.reload();
              };
              if (FS.syncfs) FS.syncfs(false, finish);
              else setTimeout(finish, 600);
            })
            .catch(function (err) { console.warn("starter save skipped:", err); });
        } catch (err) {
          console.warn("starter save skipped:", err);
        }
      }

      async function loadUnityGame() {
        if (booted) return;
        booted = true;
        loadingBar.style.display = "block";
        try {
          await prepareAssetWorker();
          await seedStarterSaveBeforeBoot();
        } catch (err) {
          var errorText = loadingBar.querySelector("p");
          if (!errorText) {
            errorText = document.createElement("p");
            loadingBar.appendChild(errorText);
          }
          errorText.textContent = "Asset setup failed: " + err.message;
          booted = false;
          return;
        }
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function(unityInstance) {
            loadingBar.style.display = "none";
            installStarterSaveAfterBoot(unityInstance);
            updateHint();
            unityInstance.SetFullscreen = function() {
              return 0;
            };
          }).catch(function(message) {
            var m = loadingBar.querySelector("p");
            if (!m) {
              m = document.createElement("p");
              loadingBar.appendChild(m);
            }
            m.textContent = message;
          });
        };
        script.onerror = function() {
          var m = loadingBar.querySelector("p");
          if (!m) {
            m = document.createElement("p");
            loadingBar.appendChild(m);
          }
          m.textContent = "Could not load Unity loader script. Check the asset proxy.";
          booted = false;
        };
        document.body.appendChild(script);
      }
