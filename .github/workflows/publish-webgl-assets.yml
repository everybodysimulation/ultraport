name: Publish ULTRAKILL WebGL assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository and download Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify game files are real binaries
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            Build/WebGL.data.unityweb \
            Build/WebGL.framework.js.unityweb \
            Build/WebGL.wasm.unityweb; do
            test -s "$file"
            if head -c 100 "$file" | grep -q "git-lfs.github.com/spec"; then
              echo "LFS pointer was not downloaded: $file"
              exit 1
            fi
          done
          count=$(find StreamingAssets/aa/WebGL -maxdepth 1 -type f -name '*.bundle' | wc -l)
          echo "Found $count Addressables bundles"
          test "$count" -eq 80
          if find StreamingAssets/aa/WebGL -maxdepth 1 -type f -name '*.bundle' -exec sh -c 'head -c 100 "$1" | grep -q "git-lfs.github.com/spec"' _ {} \; | grep -q .; then
            echo "At least one bundle is still an LFS pointer"
            exit 1
          fi
          du -sh Build StreamingAssets/aa/WebGL

      - name: Publish files as GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webgl-assets-v1
          name: ULTRAKILL WebGL runtime assets
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            Build/WebGL.data.unityweb
            Build/WebGL.framework.js.unityweb
            Build/WebGL.wasm.unityweb
            StreamingAssets/aa/WebGL/*.bundle
