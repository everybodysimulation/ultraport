<!doctype html>
<meta charset="utf-8">
<title>ULTRAKILL asset connection test</title>
<style>body{font:16px system-ui;background:#111;color:#eee;padding:24px}pre{white-space:pre-wrap;background:#222;padding:16px;border-radius:8px}</style>
<h2>ULTRAKILL asset connection test</h2>
<p>This checks GitHub Releases and the direct raw.githubusercontent.com host.</p>
<pre id="out">Testing…</pre>
<script>
const out=document.getElementById('out');
const tests=[
 ['Release framework','https://github.com/everyonesim/ultraport/releases/download/webgl-assets-v1/WebGL.framework.js.unityweb',true],
 ['Release data','https://github.com/everyonesim/ultraport/releases/download/webgl-assets-v1/WebGL.data.unityweb',false],
 ['Raw GitHub file','https://raw.githubusercontent.com/everyonesim/ultraport/main/index.html',false]
];
(async()=>{
 let lines=[];
 for(const [name,url,read] of tests){
  try{
   const r=await fetch(url,{method:'GET',mode:'cors'});
   lines.push(name+': FETCH OK; HTTP '+r.status+'; type='+r.type+'; content-length='+(r.headers.get('content-length')||'not exposed'));
   if(read){const b=await r.arrayBuffer();lines.push('Framework bytes read: '+b.byteLength);}
   else {await r.body?.cancel();}
  }catch(e){lines.push(name+': FETCH FAILED — '+e.name+': '+e.message);}
  out.textContent=lines.join('\n');
 }
})().catch(e=>out.textContent='Test error: '+e);
</script>
